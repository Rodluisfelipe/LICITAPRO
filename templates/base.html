<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}LicitaPro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-slate-100 text-slate-800 text-sm antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<div class="flex h-full">

    <aside class="w-56 shrink-0 flex flex-col bg-slate-900 text-slate-300 border-r border-slate-800">
        <div class="h-12 flex items-center px-4 border-b border-slate-800 text-white text-sm font-semibold tracking-tight">
            LicitaPro
        </div>
        <nav class="flex-1 overflow-y-auto py-2 text-[13px] leading-tight">
            <div class="px-3 pt-2 pb-1 text-[11px] font-medium uppercase tracking-wider text-slate-500">
                Comercial
            </div>
            <a href="{% url 'core:entidades' %}"
               class="block px-3 py-1.5 border-l-2 border-transparent hover:bg-slate-800 hover:text-white">
                Entidades
            </a>
            <a href="{% url 'procesos:lista' %}"
               class="block px-3 py-1.5 border-l-2 border-transparent hover:bg-slate-800 hover:text-white">
                Procesos
            </a>
            <span class="block px-3 py-1.5 border-l-2 border-transparent text-slate-600 cursor-default">
                Documentos
            </span>

            <div class="px-3 pt-3 pb-1 text-[11px] font-medium uppercase tracking-wider text-slate-500">
                Empresa
            </div>
            <span class="block px-3 py-1.5 border-l-2 border-transparent text-slate-600 cursor-default">
                Perfil
            </span>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-12 shrink-0 flex items-center justify-between px-4 border-b border-slate-200 bg-white">
            <nav class="flex items-center gap-1.5 text-xs text-slate-500">
                {% block migas %}
                    <span class="text-slate-700 font-medium">Inicio</span>
                {% endblock %}
            </nav>
            <div class="text-xs text-slate-400">{{ request.user }}</div>
        </header>

        <main class="flex-1 overflow-y-auto">
            {% block contenido %}{% endblock %}
        </main>
    </div>

</div>
</body>
</html>
