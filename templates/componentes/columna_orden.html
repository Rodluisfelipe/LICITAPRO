{% load ui %}
<th class="orden-col">
    <a href="{{ request.path }}?orden={% siguiente_orden orden campo %}"
       hx-get="{{ request.path }}?orden={% siguiente_orden orden campo %}"
       hx-include="#{{ formulario|default:'filtros' }}"
       hx-target="#{{ objetivo|default:'resultados' }}"
       hx-swap="outerHTML"
       hx-push-url="true">
        {{ etiqueta }}
        <span class="flecha">{% flecha_orden orden campo %}</span>
    </a>
</th>
