{% if proceso.fechas_verificadas_por %}
    <div class="verificacion ok">
        <svg class="icono"><use href="#i-verificado"></use></svg>
        <span>Verificado por
            {{ proceso.fechas_verificadas_por.get_full_name|default:proceso.fechas_verificadas_por.username }}
            el {{ proceso.fechas_verificadas_en|date:"d/m/Y H:i" }}</span>
    </div>
{% else %}
    <form method="post" action="{% url 'procesos:verificar_fechas' proceso.pk %}" class="verificacion">
        {% csrf_token %}
        <span class="verificacion__pendiente">⚠ Sin verificar</span>
        <button type="submit" class="verificacion__accion">Marcar como verificado</button>
    </form>
{% endif %}
