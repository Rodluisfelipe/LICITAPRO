<div class="campo">
    <label for="{{ campo.id_for_label }}" class="campo__etiqueta">
        {{ campo.label }}{% if campo.field.required %} <span class="campo__requerido">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}
        <p class="campo__ayuda">{{ campo.help_text }}</p>
    {% endif %}
    {% for error in campo.errors %}
        <p class="campo__error">{{ error }}</p>
    {% endfor %}
</div>
