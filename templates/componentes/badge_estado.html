{% with color=color|default:"gris" %}
<span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium
    {% if color == 'verde' %}bg-emerald-100 text-emerald-700
    {% elif color == 'amarillo' %}bg-amber-100 text-amber-700
    {% elif color == 'rojo' %}bg-red-100 text-red-700
    {% elif color == 'azul' %}bg-blue-100 text-blue-700
    {% else %}bg-slate-100 text-slate-600{% endif %}">
    {{ texto }}
</span>
{% endwith %}
