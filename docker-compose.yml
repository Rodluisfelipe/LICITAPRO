# Solo servicios con estado. Django y Celery corren en el host durante
# desarrollo: recarga más rápida y el debugger de VS Code funciona directo.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: licitaciones
      POSTGRES_USER: licit
      POSTGRES_PASSWORD: licit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licit -d licitaciones"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
